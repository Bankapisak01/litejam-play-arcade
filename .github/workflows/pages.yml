name: Deploy to GitHub Pages

# Builds the relocatable arcade (dist-web/: every link relative) and publishes it as the
# repository's GitHub Pages site on each push to main. Enable once in Settings → Pages →
# Source: "GitHub Actions". Runtime assets stay local; nothing is downloaded at build time.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate runtime files and run the tests
        run: |
          npm run build
          npm test
      - name: Build the relocatable site
        run: npm run relocatable
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
